# The Kotlin stdlib is provided by the IntelliJ Platform at runtime — do not bundle it.
kotlin.stdlib.default.dependency=false

# Building against the IntelliJ Platform needs a bit of heap.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

org.gradle.caching=true
# The IntelliJ Platform Gradle Plugin is not fully configuration-cache compatible yet.
org.gradle.configuration-cache=false
