<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="planetLight" x1="20" y1="9" x2="20" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54B6F0"/>
      <stop offset="1" stop-color="#1668B8"/>
    </linearGradient>
  </defs>
  <!-- back of ring (will be hidden by the planet) -->
  <g transform="rotate(-20 20 20)">
    <ellipse cx="20" cy="20" rx="17.5" ry="5.2" stroke="#9CCDEF" stroke-width="2.3" fill="none"/>
  </g>
  <!-- planet (opaque) occludes the back of the ring -->
  <circle cx="20" cy="20" r="10.5" fill="url(#planetLight)"/>
  <!-- front (lower) half of the ring, drawn over the planet -->
  <g transform="rotate(-20 20 20)">
    <path d="M2.5 20 A17.5 5.2 0 0 0 37.5 20" stroke="#9CCDEF" stroke-width="2.3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- sparkle -->
  <path d="M31.5 8l0.9 2.3 2.3 0.9-2.3 0.9-0.9 2.3-0.9-2.3-2.3-0.9 2.3-0.9z" fill="#9CCDEF"/>
</svg>
